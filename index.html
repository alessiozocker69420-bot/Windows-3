<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0078d4">
  <title>Virtual Windows 11 PC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/desktop.css">
  <link rel="stylesheet" href="styles/windows.css">
  <link rel="stylesheet" href="styles/apps.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 88 88" width="80" height="80">
        <rect x="0" y="0" width="40" height="40" fill="#f25022"/>
        <rect x="48" y="0" width="40" height="40" fill="#7fba00"/>
        <rect x="0" y="48" width="40" height="40" fill="#00a4ef"/>
        <rect x="48" y="48" width="40" height="40" fill="#ffb900"/>
      </svg>
      <div class="boot-text">Windows 11</div>
      <div class="boot-spinner"></div>
    </div>
  </div>

  <div id="desktop" class="desktop">
    <!-- Wallpaper -->
    <div id="wallpaper" class="wallpaper"></div>

    <!-- Desktop Icons -->
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <!-- Start Menu -->
    <div id="start-menu" class="start-menu hidden">
      <div class="start-menu-header">
        <div class="user-profile" id="user-profile">
          <div class="user-avatar">A</div>
          <span class="user-name">Alessio</span>
        </div>
        <button class="power-btn" id="power-btn" title="Ausschalten">⏻</button>
      </div>
      <div class="start-search">
        <input type="text" id="start-search" placeholder="Nach Apps, Einstellungen und Dokumenten suchen" autocomplete="off">
      </div>
      <div class="start-pinned">
        <div class="section-title">Angeheftet</div>
        <div id="pinned-apps" class="app-grid"></div>
      </div>
      <div class="start-all">
        <div class="section-title">Alle Apps</div>
        <div id="all-apps" class="app-list"></div>
      </div>
    </div>

    <!-- Notification Center -->
    <div id="notification-center" class="notification-center hidden">
      <div class="nc-header">
        <span>Benachrichtigungen</span>
        <button id="clear-notifications">Alle löschen</button>
      </div>
      <div id="notifications-list" class="notifications-list"></div>
      <div class="quick-settings">
        <div class="qs-item" data-action="wifi"><span>📶</span><span>WLAN</span></div>
        <div class="qs-item" data-action="bluetooth"><span>🔵</span><span>Bluetooth</span></div>
        <div class="qs-item" data-action="airplane"><span>✈️</span><span>Flugmodus</span></div>
        <div class="qs-item" data-action="night"><span>🌙</span><span>Nachtlicht</span></div>
        <div class="qs-item" data-action="focus"><span>🎯</span><span>Fokus</span></div>
        <div class="qs-item" data-action="cast"><span>📺</span><span>Übertragen</span></div>
      </div>
      <div class="volume-slider">
        <span>🔊</span>
        <input type="range" id="volume-slider" min="0" max="100" value="70">
        <span id="volume-value">70</span>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="ctx-item" data-action="view">Ansicht</div>
      <div class="ctx-item" data-action="sort">Sortieren nach</div>
      <div class="ctx-item" data-action="refresh">Aktualisieren</div>
      <div class="ctx-separator"></div>
      <div class="ctx-item" data-action="new-folder">Neuer Ordner</div>
      <div class="ctx-separator"></div>
      <div class="ctx-item" data-action="personalize">Personalisieren</div>
      <div class="ctx-item" data-action="display">Anzeigeeinstellungen</div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" class="taskbar">
      <div class="taskbar-left">
        <button id="start-btn" class="taskbar-btn start-btn" title="Start">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="2" width="9" height="9" fill="currentColor"/><rect x="13" y="2" width="9" height="9" fill="currentColor"/><rect x="2" y="13" width="9" height="9" fill="currentColor"/><rect x="13" y="13" width="9" height="9" fill="currentColor"/></svg>
        </button>
        <button id="search-btn" class="taskbar-btn" title="Suche">🔍</button>
        <button id="task-view-btn" class="taskbar-btn" title="Aufgabenansicht">▦</button>
      </div>
      <div id="taskbar-apps" class="taskbar-apps"></div>
      <div class="taskbar-right">
        <button id="tray-btn" class="taskbar-btn tray-btn" title="Ausgeblendete Symbole">⌃</button>
        <div class="system-tray">
          <span id="wifi-icon" title="WLAN verbunden">📶</span>
          <span id="volume-icon" title="Lautstärke">🔊</span>
          <span id="battery-icon" title="Akku">🔋</span>
        </div>
        <div id="clock" class="clock" title="Datum und Uhrzeit">
          <div id="clock-time">00:00</div>
          <div id="clock-date">01.01.2026</div>
        </div>
        <button id="notif-btn" class="taskbar-btn" title="Benachrichtigungen">💬</button>
      </div>
    </div>
  </div>

  <!-- Matrix Overlay -->
  <canvas id="matrix-canvas" class="matrix-canvas hidden"></canvas>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script src="apps/terminal.js"></script>
  <script src="apps/notes.js"></script>
  <script src="apps/browser.js"></script>
  <script src="apps/explorer.js"></script>
  <script src="apps/calculator.js"></script>
  <script src="apps/paint.js"></script>
  <script src="apps/settings.js"></script>
  <script src="apps/calendar.js"></script>
  <script src="apps/clock.js"></script>
  <script src="apps/music.js"></script>
  <script src="apps/video.js"></script>
  <script src="apps/image-viewer.js"></script>
  <script src="apps/notepad.js"></script>
  <script src="apps/task-manager.js"></script>
  <script src="apps/app-store.js"></script>
  <script src="apps/system-info.js"></script>
  <script src="apps/recycle-bin.js"></script>
  <script src="apps/screenshot.js"></script>
  <script src="apps/todo.js"></script>
</body>
</html>
